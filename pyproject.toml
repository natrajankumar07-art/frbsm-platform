[project]
name = "frbsm-platform"
version = "2026.1.0"
description = "AI-Powered Balance Sheet Management & Regulatory Reporting Platform"
readme = "README.md"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# uv workspace — members are the installable Python packages in this repo.
# Engine and reasoning source trees are on PYTHONPATH (see pytest config),
# not installed as packages, keeping the dependency graph simple.
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = [
    "shared/domain",
    "shared/audit",
    "shared/testing",
    "shared/utils",
    "apps/api",
    "apps/workers",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-postgresql>=6.1",
    "httpx>=0.27",
    "hypothesis>=6.103",
    "import-linter>=2.1",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "anyio[trio]>=4.4",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Import boundary enforcement (import-linter)
# These contracts are the code-level enforcement of Repository_Reconciliation §2.3.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "engines",
    "reasoning",
    "data",
    "reports",
    "workflow",
    "observability",
    "domain",
    "audit",
    "utils",
    "testing",
]
extra_paths = ["."]

[[tool.importlinter.contracts]]
name = "Reasoning layer cannot import compute engines"
type = "forbidden"
source_modules = ["reasoning"]
forbidden_modules = ["engines"]

[[tool.importlinter.contracts]]
name = "Reasoning layer cannot import numerical libraries"
type = "forbidden"
source_modules = ["reasoning"]
forbidden_modules = ["numpy", "pandas", "scipy"]

[[tool.importlinter.contracts]]
name = "Compute engines cannot import reasoning layer"
type = "forbidden"
source_modules = ["engines"]
forbidden_modules = ["reasoning"]

[[tool.importlinter.contracts]]
name = "Compute engines cannot call Anthropic API"
type = "forbidden"
source_modules = ["engines"]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "Reports layer cannot perform numerical computation"
type = "forbidden"
source_modules = ["reports"]
forbidden_modules = ["numpy", "pandas", "scipy"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "asyncpg.*",
    "hypothesis.*",
    "pytest_postgresql.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
