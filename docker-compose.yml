services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — primary datastore
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bsm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bsm
      POSTGRES_USER: bsm
      POSTGRES_PASSWORD: bsm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsm -d bsm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # FastAPI — BSM API service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: bsm_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bsm:bsm@postgres:5432/bsm
      APP_MODE: local
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload in development
      - .:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # React frontend — Vite dev server
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: bsm_web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web:cached
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
