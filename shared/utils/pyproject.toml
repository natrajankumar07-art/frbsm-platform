[project]
name = "platform-utils"
version = "0.1.0"
description = "Shared utilities: date/business-day helpers, currency/FX conversion, hashing"
requires-python = ">=3.12"
dependencies = [
    "platform-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
