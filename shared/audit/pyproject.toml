[project]
name = "platform-audit"
version = "0.1.0"
description = "Append-only, hash-chained audit logger"
requires-python = ">=3.12"
dependencies = [
    "platform-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audit"]
