[project]
name = "platform-domain"
version = "0.1.0"
description = "Canonical Pydantic v2 domain models — the single source of truth for all platform entities"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain"]
