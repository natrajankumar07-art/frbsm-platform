[project]
name = "platform-testing"
version = "0.1.0"
description = "Shared test utilities, fixtures, and base classes for golden and property tests"
requires-python = ">=3.12"
dependencies = [
    "platform-domain",
    "hypothesis>=6.103",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testing"]
