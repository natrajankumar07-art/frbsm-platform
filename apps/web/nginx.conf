server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all paths route to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Liveness probe — returns 200 with no body
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Cache immutable hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
