[project]
name = "bsm-workers"
version = "2026.1.0"
description = "BSM Platform — async job workers (narrative batching, snapshot scheduling, close calendar)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "anthropic>=0.28",
    "platform-domain",
    "platform-audit",
    "platform-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers"]
